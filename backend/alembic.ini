# Alembic configuration for the Portfolio Intelligence database.
#
# The database URL is NOT configured here. migrations/env.py reads DATABASE_URL
# from the environment or backend/.env, so credentials never live in this file.
#
# Usage (from the backend directory):
#   uv run alembic upgrade head      apply all migrations
#   uv run alembic downgrade base    remove all tables
#   uv run alembic upgrade head --sql    print the SQL without running it

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
